<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details, see:
    https://developer.flutter.dev/deployment/web#base-href
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="iot_tea">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>iot_tea</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Google Maps JavaScript API - Replace YOUR_API_KEY with your actual API key
    For development/testing, you can use a placeholder or remove this line
  -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAVgrbuweWa93expzY5oS237rrqMZTwtUs"></script>

  <!-- Firebase reCAPTCHA configuration for Phone Authentication on Web -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js"></script>
  <script>
    // Initialize reCAPTCHA for Firebase Phone Auth
    window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
      'size': 'invisible',
      'callback': function(token) {
        // Handle reCAPTCHA token
      },
      'expired-callback': function() {
        // Handle reCAPTCHA expiration
      }
    });
  </script>

</head>
<body>
  <!-- Container for reCAPTCHA -->
  <div id="recaptcha-container"></div>
  
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
